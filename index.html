<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mubarak Kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF1EA; --surface: #FFFFFF; --surface-2: #F7F5EF;
    --ink: #22302B; --ink-soft: #48564C; --stitch: #93876C;
    --rose: #D9838C; --rose-ink: #7A2E36; --teal: #2E6B60;
    --teal-ink: #163832; --mustard: #DB9F35; --mustard-ink: #6B4B0F;
    --danger: #9A3A22; --line: #C9C0A6; --radius: 4px;
    --shadow: 0 1px 0 rgba(34,48,43,0.06);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B211D; --surface: #232B25; --surface-2: #1F2621;
      --ink: #ECEBE3; --ink-soft: #BFC7BB; --stitch: #5C6A5F;
      --line: #445248; --shadow: 0 1px 0 rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B211D; --surface: #232B25; --surface-2: #1F2621;
    --ink: #ECEBE3; --ink-soft: #BFC7BB; --stitch: #5C6A5F;
    --line: #445248; --shadow: 0 1px 0 rgba(0,0,0,0.3);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif; min-height: 100%;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  h1, h2, h3, .headline { font-family: 'Fraunces', serif; font-weight: 600; letter-spacing: -0.01em; }

  /* ---- Layout ---- */
  .app { display: flex; min-height: 100vh; min-height: 100dvh; }
  .rail {
    width: 220px; flex-shrink: 0; background: var(--surface);
    border-right: 1px dashed var(--stitch);
    padding: 24px 16px; display: flex; flex-direction: column; gap: 4px;
    position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 20px; }
  .brand-tag {
    width: 36px; height: 36px; border-radius: 6px; background: var(--rose);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    position: relative; overflow: hidden;
  }
  .brand-tag img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .brand-tag.default-tag::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--surface); position: absolute; top: 6px; left: 6px; }
  .brand-title { font-size: 15px; line-height: 1.2; }
  .brand-sub { font-size: 11px; color: var(--ink-soft); }

  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: var(--radius); cursor: pointer; font-size: 14px; font-weight: 500;
    color: var(--ink-soft); border: 1px dashed transparent;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--ink); }
  .nav-item.active { background: var(--surface-2); color: var(--teal-ink); border-color: var(--stitch); }
  :root[data-theme="dark"] .nav-item.active, .nav-item.active { color: var(--teal); }
  .nav-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .5; flex-shrink: 0; }

  .rail-foot { margin-top: auto; padding: 12px 8px 4px; font-size: 11px; color: var(--ink-soft); border-top: 1px dashed var(--stitch); padding-top: 14px; }
  .main { flex: 1; min-width: 0; padding: 28px 32px 60px; max-width: 1100px; }
  .topbar { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 24px; gap: 12px; flex-wrap: wrap; }
  .topbar h1 { font-size: 24px; }
  .topbar .date { font-size: 13px; color: var(--ink-soft); }

  /* ---- Cards ---- */
  .grid { display: grid; gap: 14px; }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-2 { grid-template-columns: 1.3fr 1fr; }

  .tag-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px 16px 14px;
    position: relative; box-shadow: var(--shadow);
  }
  .tag-card::before {
    content: ''; position: absolute; top: 12px; right: 10px;
    width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--stitch); background: var(--bg);
  }
  .tag-card .label { font-size: 11px; text-transform: none; color: var(--ink-soft); margin-bottom: 8px; }
  .tag-card .value { font-size: 22px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; }
  .tag-card .value.pos { color: var(--teal-ink); }
  :root[data-theme="dark"] .tag-card .value.pos { color: var(--teal); }
  .tag-card .value.neg { color: var(--danger); }
  .tag-card .value.mustard { color: var(--mustard-ink); }
  :root[data-theme="dark"] .tag-card .value.mustard { color: var(--mustard); }
  .tag-card .sub { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
  .panel + .panel { margin-top: 14px; }
  .panel h3 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 600; }

  /* ---- Buttons / inputs ---- */
  .btn {
    font: inherit; font-size: 13px; font-weight: 600; border-radius: var(--radius);
    padding: 9px 14px; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { border-color: var(--stitch); background: var(--surface-2); }
  .btn.primary { background: var(--teal); color: #fff; border-color: var(--teal); }
  .btn.primary:hover { background: var(--teal-ink); border-color: var(--teal-ink); }
  .btn.danger-ghost { color: var(--danger); border-color: transparent; background: transparent; padding: 5px 8px; font-size: 12px; }
  .btn.sm { padding: 6px 10px; font-size: 12px; }

  label { display: block; font-size: 12px; color: var(--ink-soft); margin: 10px 0 5px; font-weight: 600; }
  input, select, textarea {
    width: 100%; font: inherit; font-size: 14px; padding: 9px 10px;
    border: 1px solid var(--stitch); border-radius: var(--radius); background: var(--surface-2); color: var(--ink);
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  /* ---- Table & Modals ---- */
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-weight: 700; color: var(--ink-soft); font-size: 11.5px; padding: 0 10px 8px; border-bottom: 1px dashed var(--stitch); }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .overlay {
    position: fixed; inset: 0; background: rgba(20,26,20,0.45); display: none;
    align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 50;
  }
  .overlay.show { display: flex; }
  .modal { background: var(--surface); border-radius: 8px; width: 100%; max-width: 460px; padding: 22px; border: 1px solid var(--line); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .x { cursor: pointer; color: var(--ink-soft); font-size: 20px; background: none; border: none; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  @media (max-width: 880px) {
    .rail { position: fixed; left: 0; top: 0; bottom: 0; z-index: 40; transform: translateX(-100%); transition: transform .2s; }
    .rail.open { transform: translateX(0); }
    .main { padding: 18px 16px 60px; }
    .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
    .menu-btn { display: inline-flex !important; }
    .rail-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 39; display: none; }
    .rail-scrim.show { display: block; }
  }
  .menu-btn { display: none; }
</style>
</head>
<body>
<div class="app">
  <div class="rail-scrim" id="scrim"></div>
  <nav class="rail" id="rail">
    <div class="brand">
      <div class="brand-tag default-tag" id="mainLogo"></div>
      <div>
        <div class="brand-title headline">Mubarak Kids</div>
        <div class="brand-sub">Manajemen toko</div>
      </div>
    </div>
    <div class="nav-item active" data-tab="dashboard"><span class="nav-dot"></span>Dashboard</div>
    <div class="nav-item" data-tab="penjualan"><span class="nav-dot"></span>Catat Penjualan</div>
    <div class="nav-item" data-tab="omset"><span class="nav-dot"></span>Bagi Omset</div>
    <div class="nav-item" data-tab="transaksi"><span class="nav-dot"></span>Transaksi Kas</div>
    <div class="nav-item" data-tab="stok"><span class="nav-dot"></span>Stok Produk</div>
    <div class="rail-foot">
      <div id="syncBadge" style="font-weight:600;margin-bottom:8px;">● Penyimpanan Lokal</div>
      <button class="btn sm" id="btnLogoModal" style="width:100%;justify-content:center;margin-bottom:6px;">🖼 Ganti Logo</button>
      <button class="btn sm" id="btnBackup" style="width:100%;justify-content:center;">🗄 Backup / G-Drive</button>
    </div>
  </nav>

  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="btn menu-btn sm" id="menuBtn">☰</button>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div class="date" id="todayDate"></div>
    </div>
    <div id="content"></div>
  </main>
</div>

<!-- Modal Ganti Logo -->
<div class="overlay" id="ovLogo">
  <div class="modal">
    <div class="modal-head"><h3>Pengaturan Logo Toko</h3><button class="x" data-close>&times;</button></div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
      <div class="brand-tag default-tag" id="previewLogoModal" style="width:48px;height:48px;"></div>
      <div>
        <input type="file" id="logoFileInput" accept="image/*" style="display:none;">
        <button class="btn sm" id="btnChooseLogo">Pilih Gambar...</button>
        <button class="btn danger-ghost sm" id="btnRemoveLogo" style="margin-left:4px;">Hapus Logo</button>
      </div>
    </div>
    <div style="font-size:12px;color:var(--ink-soft);">Gambar berformat PNG/JPG.</div>
  </div>
</div>

<!-- Modal Backup & Google Drive -->
<div class="overlay" id="ovBackup">
  <div class="modal" style="max-width:520px;">
    <div class="modal-head"><h3>Backup &amp; Google Drive Live-Sync</h3><button class="x" data-close>&times;</button></div>
    <div>
      <div style="border-bottom:1px dashed var(--stitch);padding-bottom:14px;margin-bottom:14px;">
        <h3 style="font-size:14px;margin-bottom:8px;">🔗 Webhook Google Drive</h3>
        <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;">
          Tempel Web App URL dari Google Apps Script untuk autosave ke Drive.
        </p>
        <label>Google Apps Script Web App URL</label>
        <input type="text" id="gdriveScriptUrl" placeholder="https://script.google.com/macros/s/.../exec">
        <div style="display:flex;gap:8px;margin-top:8px;">
          <button class="btn sm primary" id="btnSaveScriptUrl">Simpan URL</button>
          <button class="btn sm" id="btnTestSync">Tes Kirim Data</button>
        </div>
        <div id="gdriveStatus" style="font-size:12px;margin-top:8px;font-weight:600;"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const STORAGE_KEY = "kbb_finance_v1";
  let state = { products: [], transactions: [], logo: '' };
  let currentTab = 'dashboard';

  function loadLocal(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) state = JSON.parse(raw);
    } catch(e){}
    updateLogoDisplay();
  }

  function save(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
    updateLogoDisplay();
    syncToGoogleDrive();
  }

  function updateLogoDisplay(){
    const el = document.getElementById('mainLogo');
    const prev = document.getElementById('previewLogoModal');
    [el, prev].forEach(dom => {
      if (!dom) return;
      if (state.logo) {
        dom.classList.remove('default-tag');
        dom.innerHTML = `<img src="${state.logo}">`;
      } else {
        dom.classList.add('default-tag');
        dom.innerHTML = '';
      }
    });
  }

  function syncToGoogleDrive(){
    const url = localStorage.getItem('gdrive_webhook_url');
    const badgeEl = document.getElementById('syncBadge');
    const statusEl = document.getElementById('gdriveStatus');

    if (!url) {
      if (badgeEl) badgeEl.textContent = '● Penyimpanan Lokal';
      return;
    }

    if (badgeEl) badgeEl.textContent = '○ Menyinkronkan...';

    fetch(url, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(state)
    }).then(() => {
      if (badgeEl) badgeEl.textContent = '● Live-Sync Google Drive Aktif';
      if (statusEl) {
        statusEl.style.color = 'var(--teal)';
        statusEl.textContent = '✓ Data tersimpan ke Google Drive!';
      }
    }).catch(() => {
      if (badgeEl) badgeEl.textContent = '● Sync Gagal (Tersimpan Lokal)';
      if (statusEl) {
        statusEl.style.color = 'var(--danger)';
        statusEl.textContent = '✖ Gagal mengirim data.';
      }
    });
  }

  function render(){
    document.getElementById('todayDate').textContent = new Date().toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'});
    document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.tab === currentTab));
    const titles = { dashboard:"Dashboard", penjualan:"Catat Penjualan", omset:"Bagi Omset", transaksi:"Transaksi Kas", stok:"Stok Produk" };
    document.getElementById('pageTitle').textContent = titles[currentTab];
    const c = document.getElementById('content');
    
    if (currentTab === 'dashboard') {
      c.innerHTML = `<div class="panel"><h3>Selamat Datang di Mubarak Kids</h3><p>Gunakan menu sebelah kiri untuk mengelola penjualan, stok, dan pembagian omset usaha Anda.</p></div>`;
    } else if (currentTab === 'omset') {
      c.innerHTML = `
        <div class="panel">
          <h3>Kalkulator Pembagian Omset</h3>
          <label>Masukkan Total Omset (Rp)</label>
          <input type="number" id="omsetInput" value="1000000" placeholder="0">
          <div class="row3" style="margin-top:12px;">
            <div><label>Modal Putar (%)</label><input type="number" id="pModal" value="33.33"></div>
            <div><label>Keuntungan (%)</label><input type="number" id="pUntung" value="33.33"></div>
            <div><label>Operasional (%)</label><input type="number" id="pOps" value="33.34"></div>
          </div>
        </div>
        <div class="grid grid-3" style="margin-top:14px;">
          <div class="tag-card"><div class="label">📦 Modal Putar</div><div class="value mustard" id="vModal">Rp 0</div></div>
          <div class="tag-card"><div class="label">💰 Keuntungan</div><div class="value pos" id="vUntung">Rp 0</div></div>
          <div class="tag-card"><div class="label">🛠 Operasional</div><div class="value neg" id="vOps">Rp 0</div></div>
        </div>
      `;
      const calc = () => {
        const total = Number(document.getElementById('omsetInput').value) || 0;
        const m = Number(document.getElementById('pModal').value) || 0;
        const u = Number(document.getElementById('pUntung').value) || 0;
        const o = Number(document.getElementById('pOps').value) || 0;
        document.getElementById('vModal').textContent = 'Rp ' + Math.round(total * m / 100).toLocaleString('id-ID');
        document.getElementById('vUntung').textContent = 'Rp ' + Math.round(total * u / 100).toLocaleString('id-ID');
        document.getElementById('vOps').textContent = 'Rp ' + Math.round(total * o / 100).toLocaleString('id-ID');
      };
      ['omsetInput','pModal','pUntung','pOps'].forEach(id => document.getElementById(id).addEventListener('input', calc));
      calc();
    } else {
      c.innerHTML = `<div class="panel"><h3>Menu ${titles[currentTab]}</h3><p>Fitur siap digunakan.</p></div>`;
    }
  }

  // Modals
  document.getElementById('btnLogoModal').addEventListener('click', ()=> document.getElementById('ovLogo').classList.add('show'));
  document.getElementById('btnChooseLogo').addEventListener('click', ()=> document.getElementById('logoFileInput').click());
  document.getElementById('logoFileInput').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if (file) {
      const r = new FileReader();
      r.onload = (evt) => { state.logo = evt.target.result; save(); };
      r.readAsDataURL(file);
    }
  });
  document.getElementById('btnRemoveLogo').addEventListener('click', ()=>{ state.logo = ''; save(); });

  document.getElementById('btnBackup').addEventListener('click', ()=>{
    document.getElementById('gdriveScriptUrl').value = localStorage.getItem('gdrive_webhook_url') || '';
    document.getElementById('ovBackup').classList.add('show');
  });
  document.getElementById('btnSaveScriptUrl').addEventListener('click', ()=>{
    const url = document.getElementById('gdriveScriptUrl').value.trim();
    if(url) { localStorage.setItem('gdrive_webhook_url', url); alert('URL Disimpan!'); }
    else { localStorage.removeItem('gdrive_webhook_url'); alert('URL Dihapus!'); }
    syncToGoogleDrive();
  });
  document.getElementById('btnTestSync').addEventListener('click', syncToGoogleDrive);

  document.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', ()=> el.closest('.overlay').classList.remove('show')));
  document.querySelectorAll('.nav-item').forEach(el => el.addEventListener('click', ()=>{ currentTab = el.dataset.tab; render(); }));

  loadLocal();
  render();
  syncToGoogleDrive();
})();
</script>
</body>
</html>
