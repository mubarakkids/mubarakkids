<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mubarak Kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF1EA; --surface: #FFFFFF; --surface-2: #F7F5EF;
    --ink: #22302B; --ink-soft: #48564C; --stitch: #93876C;
    --rose: #D9838C; --rose-ink: #7A2E36; --teal: #2E6B60;
    --teal-ink: #163832; --mustard: #DB9F35; --mustard-ink: #6B4B0F;
    --danger: #9A3A22; --line: #C9C0A6; --radius: 4px;
    --shadow: 0 1px 0 rgba(34,48,43,0.06);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B211D; --surface: #232B25; --surface-2: #1F2621;
      --ink: #ECEBE3; --ink-soft: #BFC7BB; --stitch: #5C6A5F;
      --line: #445248; --shadow: 0 1px 0 rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B211D; --surface: #232B25; --surface-2: #1F2621;
    --ink: #ECEBE3; --ink-soft: #BFC7BB; --stitch: #5C6A5F;
    --line: #445248; --shadow: 0 1px 0 rgba(0,0,0,0.3);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif; min-height: 100%;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  h1, h2, h3, .headline { font-family: 'Fraunces', serif; font-weight: 600; letter-spacing: -0.01em; }

  /* ---- Layout ---- */
  .app { display: flex; min-height: 100vh; min-height: 100dvh; }
  .rail {
    width: 220px; flex-shrink: 0; background: var(--surface);
    border-right: 1px dashed var(--stitch);
    padding: 24px 16px; display: flex; flex-direction: column; gap: 4px;
    position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 20px; }
  .brand-tag {
    width: 30px; height: 30px; border-radius: 6px; background: var(--rose);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    position: relative; overflow: hidden;
  }
  .brand-tag img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .brand-tag.default-tag::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--surface); position: absolute; top: 6px; left: 6px; }
  .brand-title { font-size: 15px; line-height: 1.2; }
  .brand-sub { font-size: 11px; color: var(--ink-soft); }

  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: var(--radius); cursor: pointer; font-size: 14px; font-weight: 500;
    color: var(--ink-soft); border: 1px dashed transparent;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--ink); }
  .nav-item.active { background: var(--surface-2); color: var(--teal-ink); border-color: var(--stitch); }
  :root[data-theme="dark"] .nav-item.active, .nav-item.active { color: var(--teal); }
  .nav-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .5; flex-shrink: 0; }

  .rail-foot { margin-top: auto; padding: 12px 8px 4px; font-size: 11px; color: var(--ink-soft); border-top: 1px dashed var(--stitch); padding-top: 14px; }
  .main { flex: 1; min-width: 0; padding: 28px 32px 60px; max-width: 1100px; }
  .topbar { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 24px; gap: 12px; flex-wrap: wrap; }
  .topbar h1 { font-size: 24px; }
  .topbar .date { font-size: 13px; color: var(--ink-soft); }

  /* ---- Cards ---- */
  .grid { display: grid; gap: 14px; }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-2 { grid-template-columns: 1.3fr 1fr; }

  .tag-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px 16px 14px;
    position: relative; box-shadow: var(--shadow);
  }
  .tag-card::before {
    content: ''; position: absolute; top: 12px; right: 10px;
    width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--stitch); background: var(--bg);
  }
  .tag-card .label { font-size: 11px; text-transform: none; color: var(--ink-soft); margin-bottom: 8px; }
  .tag-card .value { font-size: 22px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; }
  .tag-card .value.pos { color: var(--teal-ink); }
  :root[data-theme="dark"] .tag-card .value.pos { color: var(--teal); }
  .tag-card .value.neg { color: var(--danger); }
  .tag-card .value.mustard { color: var(--mustard-ink); }
  :root[data-theme="dark"] .tag-card .value.mustard { color: var(--mustard); }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
  .panel + .panel { margin-top: 14px; }
  .panel h3 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 600; }

  /* ---- Buttons / inputs ---- */
  .btn {
    font: inherit; font-size: 13px; font-weight: 600; border-radius: var(--radius);
    padding: 9px 14px; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { border-color: var(--stitch); background: var(--surface-2); }
  .btn.primary { background: var(--teal); color: #fff; border-color: var(--teal); }
  .btn.primary:hover { background: var(--teal-ink); border-color: var(--teal-ink); }
  .btn.danger-ghost { color: var(--danger); border-color: transparent; background: transparent; padding: 5px 8px; font-size: 12px; }
  .btn.sm { padding: 6px 10px; font-size: 12px; }

  label { display: block; font-size: 12px; color: var(--ink-soft); margin: 10px 0 5px; font-weight: 600; }
  input, select, textarea {
    width: 100%; font: inherit; font-size: 14px; padding: 9px 10px;
    border: 1px solid var(--stitch); border-radius: var(--radius); background: var(--surface-2); color: var(--ink);
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .seg button { flex: 1; padding: 9px; font: inherit; font-size: 13px; font-weight: 600; background: var(--surface-2); border: none; color: var(--ink-soft); cursor: pointer; }
  .seg button.on.income { background: var(--teal); color: #fff; }
  .seg button.on.expense { background: var(--rose); color: #fff; }

  /* ---- Table & Modals ---- */
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-weight: 700; color: var(--ink-soft); font-size: 11.5px; padding: 0 10px 8px; border-bottom: 1px dashed var(--stitch); }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .pill.income { background: rgba(46,107,96,0.13); color: var(--teal-ink); }
  .pill.expense { background: rgba(217,131,140,0.16); color: var(--rose-ink); }
  .pill.low { background: rgba(219,159,53,0.18); color: var(--mustard-ink); }
  .amt.income { color: var(--teal-ink); }
  .amt.expense { color: var(--danger); }
  .empty { padding: 34px 10px; text-align: center; color: var(--ink-soft); font-size: 13.5px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(20,26,20,0.45); display: none;
    align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 50;
  }
  .overlay.show { display: flex; }
  .modal { background: var(--surface); border-radius: 8px; width: 100%; max-width: 460px; padding: 22px; border: 1px solid var(--line); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .x { cursor: pointer; color: var(--ink-soft); font-size: 20px; background: none; border: none; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  .stock-bar-bg { width: 100%; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .stock-bar-fill { height: 100%; background: var(--teal); }
  .stock-bar-fill.low { background: var(--mustard); }

  @media (max-width: 880px) {
    .rail { position: fixed; left: 0; top: 0; bottom: 0; z-index: 40; transform: translateX(-100%); transition: transform .2s; }
    .rail.open { transform: translateX(0); }
    .main { padding: 18px 16px 60px; }
    .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
    .menu-btn { display: inline-flex !important; }
    .rail-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 39; display: none; }
    .rail-scrim.show { display: block; }
  }
  .menu-btn { display: none; }
</style>
</head>
<body>
<div class="app">
  <div class="rail-scrim" id="scrim"></div>
  <nav class="rail" id="rail">
    <div class="brand">
      <div class="brand-tag default-tag" id="mainLogo"></div>
      <div>
        <div class="brand-title headline">Mubarak Kids</div>
        <div class="brand-sub">Manajemen toko</div>
      </div>
    </div>
    <div class="nav-item active" data-tab="dashboard"><span class="nav-dot"></span>Dashboard</div>
    <div class="nav-item" data-tab="penjualan"><span class="nav-dot"></span>Catat Penjualan</div>
    <div class="nav-item" data-tab="omset"><span class="nav-dot"></span>Bagi Omset</div>
    <div class="nav-item" data-tab="transaksi"><span class="nav-dot"></span>Transaksi Kas</div>
    <div class="nav-item" data-tab="stok"><span class="nav-dot"></span>Stok Produk</div>
    <div class="rail-foot">
      <div id="syncBadge" style="font-weight:600;margin-bottom:8px;">● Penyimpanan Lokal</div>
      <button class="btn sm" id="btnLogoModal" style="width:100%;justify-content:center;margin-bottom:6px;">🖼 Ganti Logo</button>
      <button class="btn sm" id="btnBackup" style="width:100%;justify-content:center;">🗄 Backup / G-Drive</button>
    </div>
  </nav>

  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="btn menu-btn sm" id="menuBtn">☰</button>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div class="date" id="todayDate"></div>
    </div>
    <div id="content"></div>
  </main>
</div>

<!-- Modal: Transaksi -->
<div class="overlay" id="ovTrans">
  <div class="modal">
    <div class="modal-head"><h3>Tambah Transaksi</h3><button class="x" data-close>&times;</button></div>
    <div class="seg" id="transTypeSeg">
      <button type="button" class="on income" data-type="income">Pemasukan</button>
      <button type="button" data-type="expense">Pengeluaran</button>
    </div>
    <label>Kategori</label>
    <select id="tCategory"></select>
    <div class="row2">
      <div><label>Jumlah (Rp)</label><input type="number" id="tAmount" placeholder="0"></div>
      <div><label>Tanggal</label><input type="date" id="tDate"></div>
    </div>
    <label>Catatan</label>
    <input type="text" id="tNote" placeholder="Catatan transaksi...">
    <div class="modal-actions">
      <button class="btn" data-close>Batal</button>
      <button class="btn primary" id="saveTrans">Simpan</button>
    </div>
  </div>
</div>

<!-- Modal: Produk -->
<div class="overlay" id="ovProduk">
  <div class="modal">
    <div class="modal-head"><h3>Tambah Produk</h3><button class="x" data-close>&times;</button></div>
    <input type="hidden" id="pId">
    <label>Nama Produk</label>
    <input type="text" id="pName" placeholder="Contoh: Jumper Bayi">
    <div class="row2">
      <div><label>Ukuran</label><input type="text" id="pSize" placeholder="S, M, L"></div>
      <div><label>Warna</label><input type="text" id="pColor" placeholder="Merah, Biru"></div>
    </div>
    <div class="row2">
      <div><label>Modal (Rp)</label><input type="number" id="pBuy" placeholder="0"></div>
      <div><label>Harga Jual (Rp)</label><input type="number" id="pSell" placeholder="0"></div>
    </div>
    <div class="row2">
      <div><label>Stok Awal</label><input type="number" id="pStock" placeholder="0"></div>
      <div><label>Batas Stok Menipis</label><input type="number" id="pMin" value="3"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" data-close>Batal</button>
      <button class="btn primary" id="saveProduk">Simpan</button>
    </div>
  </div>
</div>

<!-- Modal: Penjualan -->
<div class="overlay" id="ovJual">
  <div class="modal">
    <div class="modal-head"><h3>Catat Penjualan</h3><button class="x" data-close>&times;</button></div>
    <label>Pilih Produk</label>
    <select id="jProduct"></select>
    <div class="row2">
      <div><label>Jumlah (Qty)</label><input type="number" id="jQty" value="1" min="1"></div>
      <div><label>Harga Satuan (Rp)</label><input type="number" id="jPrice"></div>
    </div>
    <div class="row2">
      <div><label>Tanggal</label><input type="date" id="jDate"></div>
      <div><label>Ongkir Toko (Rp)</label><input type="number" id="jShip" value="0"></div>
    </div>
    <div style="margin-top:10px;font-size:12.5px;color:var(--ink-soft);" id="jPreview"></div>
    <div class="modal-actions">
      <button class="btn" data-close>Batal</button>
      <button class="btn primary" id="saveJual">Simpan Penjualan</button>
    </div>
  </div>
</div>

<!-- Modal Logo -->
<div class="overlay" id="ovLogo">
  <div class="modal">
    <div class="modal-head"><h3>Ganti Logo Toko</h3><button class="x" data-close>&times;</button></div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
      <div class="brand-tag default-tag" id="previewLogoModal" style="width:48px;height:48px;"></div>
      <div>
        <input type="file" id="logoFileInput" accept="image/*" style="display:none;">
        <button class="btn sm" id="btnChooseLogo">Pilih Gambar...</button>
        <button class="btn danger-ghost sm" id="btnRemoveLogo">Hapus Logo</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Backup -->
<div class="overlay" id="ovBackup">
  <div class="modal" style="max-width:520px;">
    <div class="modal-head"><h3>Backup &amp; G-Drive Live Sync</h3><button class="x" data-close>&times;</button></div>
    <label>Google Apps Script Web App URL</label>
    <input type="text" id="gdriveScriptUrl" placeholder="https://script.google.com/macros/s/.../exec">
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button class="btn sm primary" id="btnSaveScriptUrl">Simpan URL</button>
      <button class="btn sm" id="btnTestSync">Tes Sync</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const STORAGE_KEY = "kbb_finance_v1";
  const EXPENSE_CATS = ["Belanja Stok Baju", "Ongkos Kirim", "Kemasan & Packing", "Marketing / Iklan", "Sewa & Operasional", "Lainnya"];
  const INCOME_CATS = ["Penjualan Produk", "Pemasukan Lain"];
  let state = { products: [], transactions: [], logo: '' };
  let currentTab = 'dashboard';

  function loadLocal(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) state = JSON.parse(raw);
    } catch(e){}
    updateLogoDisplay();
  }

  function save(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
    updateLogoDisplay();
    syncToGoogleDrive();
  }

  function updateLogoDisplay(){
    const mainLogo = document.getElementById('mainLogo');
    const prevLogo = document.getElementById('previewLogoModal');
    [mainLogo, prevLogo].forEach(el => {
      if(!el) return;
      if(state.logo) {
        el.classList.remove('default-tag');
        el.innerHTML = `<img src="${state.logo}">`;
      } else {
        el.classList.add('default-tag');
        el.innerHTML = '';
      }
    });
  }

  function syncToGoogleDrive(){
    const url = localStorage.getItem('gdrive_webhook_url');
    const badge = document.getElementById('syncBadge');
    if (!url) { if(badge) badge.textContent = '● Penyimpanan Lokal'; return; }
    if(badge) badge.textContent = '○ Menyinkronkan...';
    fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state) })
    .then(() => { if(badge) badge.textContent = '● Live-Sync G-Drive Aktif'; })
    .catch(() => { if(badge) badge.textContent = '● Sync Gagal (Lokal)'; });
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function rupiah(n){ return "Rp " + (Math.round(Number(n)||0)).toLocaleString('id-ID'); }

  function render(){
    document.getElementById('todayDate').textContent = new Date().toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'});
    document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.tab === currentTab));
    const titles = { dashboard:"Dashboard", penjualan:"Catat Penjualan", omset:"Bagi Omset", transaksi:"Transaksi Kas", stok:"Stok Produk" };
    document.getElementById('pageTitle').textContent = titles[currentTab];
    const c = document.getElementById('content');

    if (currentTab === 'dashboard') {
      const inc = state.transactions.filter(t=>t.type==='income').reduce((a,b)=>a+b.amount,0);
      const exp = state.transactions.filter(t=>t.type==='expense').reduce((a,b)=>a+b.amount,0);
      c.innerHTML = `
        <div class="grid grid-4">
          <div class="tag-card"><div class="label">Total Pemasukan</div><div class="value pos num">${rupiah(inc)}</div></div>
          <div class="tag-card"><div class="label">Total Pengeluaran</div><div class="value neg num">${rupiah(exp)}</div></div>
          <div class="tag-card"><div class="label">Laba Bersih</div><div class="value pos num">${rupiah(inc - exp)}</div></div>
          <div class="tag-card"><div class="label">Total Stok</div><div class="value mustard num">${state.products.reduce((a,b)=>a+Number(b.stock),0)} pcs</div></div>
        </div>
      `;
    } else if (currentTab === 'stok') {
      c.innerHTML = `
        <div class="panel">
          <h3>Daftar Stok Produk <button class="btn primary sm" id="btnAddProduk">+ Tambah Produk</button></h3>
          ${!state.products.length ? `<div class="empty">Belum ada produk tersimpan.</div>` : `
          <div style="overflow-x:auto;"><table>
            <thead><tr><th>Nama Produk</th><th>Ukuran/Warna</th><th>Modal</th><th>Harga Jual</th><th>Stok</th><th>Aksi</th></tr></thead>
            <tbody>
              ${state.products.map(p=>`
                <tr>
                  <td><b>${p.name}</b></td>
                  <td>${p.size||'-'} / ${p.color||'-'}</td>
                  <td class="num">${rupiah(p.buyPrice)}</td>
                  <td class="num">${rupiah(p.sellPrice)}</td>
                  <td class="num"><b>${p.stock} pcs</b></td>
                  <td><button class="btn danger-ghost sm" data-del-p="${p.id}">Hapus</button></td>
                </tr>`).join('')}
            </tbody>
          </table></div>`}
        </div>`;
    } else if (currentTab === 'transaksi') {
      c.innerHTML = `
        <div class="panel">
          <h3>Transaksi Kas <button class="btn primary sm" id="btnAddTrans">+ Transaksi</button></h3>
          ${!state.transactions.length ? `<div class="empty">Belum ada transaksi kas.</div>` : `
          <div style="overflow-x:auto;"><table>
            <thead><tr><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Catatan</th><th>Jumlah</th><th>Aksi</th></tr></thead>
            <tbody>
              ${state.transactions.map(t=>`
                <tr>
                  <td>${t.date}</td>
                  <td><span class="pill ${t.type}">${t.type==='income'?'Masuk':'Keluar'}</span></td>
                  <td>${t.category}</td>
                  <td>${t.note||'-'}</td>
                  <td class="num amt ${t.type}">${t.type==='expense'?'-':'+'}${rupiah(t.amount)}</td>
                  <td><button class="btn danger-ghost sm" data-del-t="${t.id}">Hapus</button></td>
                </tr>`).join('')}
            </tbody>
          </table></div>`}
        </div>`;
    } else if (currentTab === 'penjualan') {
      c.innerHTML = `
        <div class="panel">
          <h3>Catat Penjualan <button class="btn primary sm" id="btnAddJual" ${state.products.length?'':'disabled'}>+ Catat Penjualan</button></h3>
          ${!state.products.length ? `<div class="empty">Tambahkan produk di menu Stok Produk terlebih dahulu.</div>` : ''}
        </div>`;
    } else if (currentTab === 'omset') {
      c.innerHTML = `
        <div class="panel">
          <h3>Kalkulator Pembagian Omset</h3>
          <label>Total Omset (Rp)</label>
          <input type="number" id="omsetInput" value="1000000">
          <div class="row3" style="margin-top:10px;">
            <div><label>Modal Putar (%)</label><input type="number" id="pModal" value="33.33"></div>
            <div><label>Keuntungan (%)</label><input type="number" id="pUntung" value="33.33"></div>
            <div><label>Operasional (%)</label><input type="number" id="pOps" value="33.34"></div>
          </div>
        </div>
        <div class="grid grid-3" style="margin-top:14px;">
          <div class="tag-card"><div class="label">Modal Putar</div><div class="value mustard" id="vModal">Rp 0</div></div>
          <div class="tag-card"><div class="label">Keuntungan</div><div class="value pos" id="vUntung">Rp 0</div></div>
          <div class="tag-card"><div class="label">Operasional</div><div class="value neg" id="vOps">Rp 0</div></div>
        </div>`;
      const calc = () => {
        const tot = Number(document.getElementById('omsetInput').value)||0;
        document.getElementById('vModal').textContent = rupiah(tot * (Number(document.getElementById('pModal').value)||0)/100);
        document.getElementById('vUntung').textContent = rupiah(tot * (Number(document.getElementById('pUntung').value)||0)/100);
        document.getElementById('vOps').textContent = rupiah(tot * (Number(document.getElementById('pOps').value)||0)/100);
      };
      ['omsetInput','pModal','pUntung','pOps'].forEach(id => document.getElementById(id).addEventListener('input', calc));
      calc();
    }
    attachEvents();
  }

  function attachEvents(){
    const btnP = document.getElementById('btnAddProduk');
    if(btnP) btnP.onclick = () => { document.getElementById('ovProduk').classList.add('show'); };
    const btnT = document.getElementById('btnAddTrans');
    if(btnT) btnT.onclick = () => {
      document.getElementById('tCategory').innerHTML = EXPENSE_CATS.map(c=>`<option value="${c}">${c}</option>`).join('');
      document.getElementById('tDate').value = todayStr();
      document.getElementById('ovTrans').classList.add('show');
    };
    const btnJ = document.getElementById('btnAddJual');
    if(btnJ) btnJ.onclick = () => {
      document.getElementById('jProduct').innerHTML = state.products.map(p=>`<option value="${p.id}">${p.name} (Stok: ${p.stock})</option>`).join('');
      document.getElementById('jDate').value = todayStr();
      document.getElementById('ovJual').classList.add('show');
    };

    document.querySelectorAll('[data-del-p]').forEach(el => el.onclick = () => {
      state.products = state.products.filter(p=>p.id!==el.dataset.delP); save(); render();
    });
    document.querySelectorAll('[data-del-t]').forEach(el => el.onclick = () => {
      state.transactions = state.transactions.filter(t=>t.id!==el.dataset.delT); save(); render();
    });
  }

  // Save Modals
  document.getElementById('saveProduk').onclick = () => {
    const name = document.getElementById('pName').value.trim();
    if(!name) return;
    state.products.push({
      id: uid(), name, size: document.getElementById('pSize').value,
      color: document.getElementById('pColor').value,
      buyPrice: Number(document.getElementById('pBuy').value)||0,
      sellPrice: Number(document.getElementById('pSell').value)||0,
      stock: Number(document.getElementById('pStock').value)||0
    });
    save(); document.getElementById('ovProduk').classList.remove('show'); render();
  };

  document.getElementById('saveTrans').onclick = () => {
    const amount = Number(document.getElementById('tAmount').value);
    if(!amount) return;
    const typeBtn = document.querySelector('#transTypeSeg button.on');
    state.transactions.push({
      id: uid(), type: typeBtn.dataset.type, category: document.getElementById('tCategory').value,
      amount, date: document.getElementById('tDate').value || todayStr(), note: document.getElementById('tNote').value
    });
    save(); document.getElementById('ovTrans').classList.remove('show'); render();
  };

  document.querySelectorAll('[data-close]').forEach(el => el.onclick = () => el.closest('.overlay').classList.remove('show'));
  document.querySelectorAll('.nav-item').forEach(el => el.onclick = () => { currentTab = el.dataset.tab; render(); });

  document.getElementById('btnBackup').onclick = () => document.getElementById('ovBackup').classList.add('show');
  document.getElementById('btnSaveScriptUrl').onclick = () => {
    localStorage.setItem('gdrive_webhook_url', document.getElementById('gdriveScriptUrl').value.trim());
    syncToGoogleDrive(); alert('URL Disimpan!');
  };

  document.getElementById('btnLogoModal').onclick = () => document.getElementById('ovLogo').classList.add('show');
  document.getElementById('btnChooseLogo').onclick = () => document.getElementById('logoFileInput').click();
  document.getElementById('logoFileInput').onchange = (e) => {
    const f = e.target.files[0];
    if(f){ const r = new FileReader(); r.onload = (evt) => { state.logo = evt.target.result; save(); }; r.readAsDataURL(f); }
  };
  document.getElementById('btnRemoveLogo').onclick = () => { state.logo = ''; save(); };

  loadLocal(); render(); syncToGoogleDrive();
})();
</script>
</body>
</html>
